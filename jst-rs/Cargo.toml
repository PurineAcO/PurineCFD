[package]
name = "jst"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "2D JST + Spalart-Allmaras finite-volume solver on O-meshes"
license = "MIT"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
approx = "0.5"

[[bin]]
name = "jst"
path = "src/bin/jst.rs"

[[bench]]
name = "kernels"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
